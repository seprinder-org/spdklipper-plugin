<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login SEPRINDER</title>
  <link rel="icon" href="/public/image/favicon.ico" type="image/x-icon">
  <!-- Tailwindcss -->
  <link href="{{url_for('static',path='/css/app.css')}}" rel="stylesheet" />
</head>
<body class="flex justify-center items-center min-h-screen bg-gray-100">
  <div class="flex flex-col items-center gap-6">
    
    <!-- Login box -->
    <div class="bg-white shadow-md rounded-lg p-6 w-80 text-center">
      <h2 class="text-2xl font-semibold text-gray-700 mb-5">Login</h2>
      <form action="/login" method="post" class="space-y-4">
        <div class="text-left">
          <label for="username" class="block text-gray-600 font-medium mb-1">Username:</label>
          <input type="text" id="username" name="username" required
                 class="w-full border border-gray-300 rounded px-3 py-2 focus:ring-2 focus:ring-blue-400 focus:outline-none">
        </div>
        <div class="text-left">
          <label for="password" class="block text-gray-600 font-medium mb-1">Password:</label>
          <input type="password" id="password" name="password" required
                 class="w-full border border-gray-300 rounded px-3 py-2 focus:ring-2 focus:ring-blue-400 focus:outline-none">
        </div>
        <div class="text-left">
          <label for="machineIdentifyNumber" class="block text-gray-600 font-medium mb-1">Machine ID:</label>
          <input type="text" id="machineIdentifyNumber" name="machineIdentifyNumber" required
                 class="w-full border border-gray-300 rounded px-3 py-2 focus:ring-2 focus:ring-blue-400 focus:outline-none">
        </div>
        <div>
          <input type="submit" value="Submit"
                 class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 cursor-pointer transition">
        </div>
      </form>
    </div>

    <!-- Log box -->
    <div class="bg-white shadow-md rounded-lg p-6 w-80 text-left">
      <h2 class="text-lg font-semibold text-gray-700 mb-3">Server Logs</h2>
      <div id="log-output" class="max-h-52 overflow-y-auto border border-gray-200 p-3 bg-gray-50 font-mono text-xs whitespace-pre-wrap break-words">
        {% for log in logs %}
          <p class="border-b border-dotted border-gray-200 last:border-0 py-1">{{ log }}</p>
        {% endfor %}
      </div>
    </div>

  </div>
</body>
</html>
