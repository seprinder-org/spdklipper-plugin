# SPD Machine Info Macros
# ========================
# Include this file in printer.cfg:
#   [include spd_machine_info.cfg]
#
# This provides Machine Info display on Fluidd/Mainsail.
# The Moonraker spd_status component handles automatic updates
# every 5 seconds via display_status (Fluidd status bar).
#
# These macros are for manual triggering from the console:
#   1. DISPLAY_SPD_INFO - Shows Machine Info in Console tab
#   2. SPD_MACHINE_INFO - Alias for DISPLAY_SPD_INFO
#
# How Fluidd/Mainsail displays the info:
#   - Status Bar (automatic): Moonraker component updates every 5s
#   - Console: Run DISPLAY_SPD_INFO manually
#
# Prerequisites:
#   - SPDKlipper plugin running
#   - Moonraker with [spd_status] component installed
#   - This file included in printer.cfg
#
# NOTE: [save_variables] is NOT required. All macros work without it.

[gcode_macro DISPLAY_SPD_INFO]
description: Display SPD Machine Info in the Console tab
gcode:
    RESPOND TYPE=command MSG="========================================"
    RESPOND TYPE=command MSG="  SPD Machine Info"
    RESPOND TYPE=command MSG="----------------------------------------"
    RESPOND TYPE=command MSG="  Check the Fluidd status bar (top-right)"
    RESPOND TYPE=command MSG="  for live SPD connection status."
    RESPOND TYPE=command MSG="----------------------------------------"
    RESPOND TYPE=command MSG="  API: curl http://localhost:7125/server/spd_status/info"
    RESPOND TYPE=command MSG="  API: curl http://localhost:1122/machine/info"
    RESPOND TYPE=command MSG="========================================"


[gcode_macro SPD_MACHINE_INFO]
description: Display SPD Machine Info in the Console tab
gcode:
    DISPLAY_SPD_INFO
