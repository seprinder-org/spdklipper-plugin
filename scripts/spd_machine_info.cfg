# SPD Machine Info
# ================
# Include this file in printer.cfg:
#   [include spd_machine_info.cfg]
#
# Prerequisites:
#   1. spd_machine_info.py must be installed to Klipper's extras directory:
#      cp spd_machine_info.py ~/klipper/klippy/extras/spd_machine_info.py
#
#   2. SPDKlipper plugin must be running (writes spd_status.json)
#
#   3. Restart Klipper after installing

[spd_machine_info]

[gcode_macro MACHINE_INFO]
description: Show SPD Machine Info (ID, Status, Server)
gcode:
    SPD_MACHINE_INFO

[delayed_gcode MACHINE_INFO_STARTUP]
initial_duration: 10.
gcode:
    MACHINE_INFO
