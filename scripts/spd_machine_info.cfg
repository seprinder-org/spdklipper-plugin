# SPD Machine Info Macro
# =======================
# Include this file in printer.cfg:
#   [include spd_machine_info.cfg]
#
# This provides a single macro SPD_MACHINE_INFO that displays Machine ID,
# Connection Status, and Last Seen on the Fluidd/Mainsail console.
#
# How it works:
#   - Moonraker machine_status component fetches /machine/info from the
#     SPDKlipper plugin API every 10 seconds via Python aiohttp
#   - Stores the data in Klipper's save_variables (variable: spd_machine_info)
#   - This macro reads printer.save_variables.variables.spd_machine_info
#     and displays it via RESPOND
#
# Prerequisites:
#   - SPDKlipper plugin running (provides /machine/info API on port 1122)
#   - Moonraker with [machine_status] component installed
#   - [save_variables] configured in printer.cfg:
#       [save_variables]
#       filename: ~/printer_data/config/save_variables.cfg
#   - This file included in printer.cfg

[gcode_macro SPD_MACHINE_INFO]
description: Show SPD Machine Info (ID, Status, Last Seen)
gcode:
    {% set sv = printer.save_variables.variables %}
    {% set info = sv.get('spd_machine_info', '{}') | from_json %}
    {% set mid = info.get('machine_id', 'N/A') %}
    {% set mname = info.get('machine_name', '') %}
    {% set connected = info.get('connected', False) %}
    {% set status = info.get('status', 'disconnected') %}
    {% set last_seen = info.get('last_seen_display', '--:--:--') %}
    {% if connected %}
        {% set icon = '●' %}
        {% set status_label = 'CONNECTED' %}
    {% else %}
        {% set icon = '○' %}
        {% set status_label = 'DISCONNECTED' %}
    {% endif %}
    RESPOND TYPE=command MSG="========================================"
    RESPOND TYPE=command MSG="  SPD Machine Info"
    RESPOND TYPE=command MSG="----------------------------------------"
    RESPOND TYPE=command MSG="  Machine ID  : {mid}"
    RESPOND TYPE=command MSG="  Name        : {mname}"
    RESPOND TYPE=command MSG="  Status      : {icon} {status_label}"
    RESPOND TYPE=command MSG="  Last Seen   : {last_seen}"
    RESPOND TYPE=command MSG="========================================"
