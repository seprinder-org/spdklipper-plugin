# SPD Machine Info Macro
# =======================
# Include this file in printer.cfg:
#   [include spd_machine_info.cfg]
#
# Provides MACHINE_INFO macro that automatically fetches Machine ID,
# Connection Status, and Server Name from the SPDKlipper plugin API
# and displays them on the Fluidd/Mainsail console.
#
# How it works:
#   1. [shell_command _FETCH_MACHINE_INFO]
#      - Runs: curl + python to fetch and parse /machine/info from plugin API
#      - Outputs pipe-delimited fields for easy Jinja2 parsing
#
#   2. [gcode_macro _DO_FETCH_MACHINE_INFO]
#      - Internal helper that calls RUN_SHELL_COMMAND
#      - Stores result in printer["gcode_macro _DO_FETCH_MACHINE_INFO"].result
#
#   3. [gcode_macro MACHINE_INFO]
#      - Calls _DO_FETCH_MACHINE_INFO to get data
#      - Parses the pipe-delimited result
#      - Displays Machine ID, Status (●/○), Server via RESPOND
#
#   4. [delayed_gcode MACHINE_INFO_STARTUP]
#      - Automatically runs MACHINE_INFO 10 seconds after Klipper starts
#
# Prerequisites:
#   - SPDKlipper plugin running (provides /machine/info API on port 1122)
#   - curl and python3 installed
#   - This file included in printer.cfg

[shell_command _FETCH_MACHINE_INFO]
command: curl -s http://127.0.0.1:1122/machine/info | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('machine_id','N/A')+'|'+d.get('machine_name','')+'|'+str(d.get('connected',False)).lower()+'|'+d.get('status','disconnected'))"
timeout: 5.
verbose: False

[gcode_macro _DO_FETCH_MACHINE_INFO]
gcode:
    RUN_SHELL_COMMAND CMD=_FETCH_MACHINE_INFO

[gcode_macro MACHINE_INFO]
description: Show SPD Machine Info (ID, Status, Server)
gcode:
    _DO_FETCH_MACHINE_INFO
    {% set raw = printer["gcode_macro _DO_FETCH_MACHINE_INFO"].result %}
    {% set parts = raw.split("|") %}
    {% set machine_id = parts[0] %}
    {% set machine_name = parts[1] %}
    {% set is_connected = parts[2] %}
    {% set status_text = parts[3] %}
    {% set server_name = printer.system_stats.hostname %}
    {% if is_connected == "true" %}
        {% set icon = "●" %}
        {% set status_label = "CONNECTED" %}
    {% else %}
        {% set icon = "○" %}
        {% set status_label = "DISCONNECTED" %}
    {% endif %}
    RESPOND TYPE=command MSG="========================================"
    RESPOND TYPE=command MSG="  SPD Machine Info"
    RESPOND TYPE=command MSG="----------------------------------------"
    RESPOND TYPE=command MSG="  Machine ID  : {machine_id}"
    RESPOND TYPE=command MSG="  Name        : {machine_name}"
    RESPOND TYPE=command MSG="  Status      : {icon} {status_label}"
    RESPOND TYPE=command MSG="  Server      : {server_name}"
    RESPOND TYPE=command MSG="========================================"

[delayed_gcode MACHINE_INFO_STARTUP]
initial_duration: 10.
gcode:
    MACHINE_INFO
