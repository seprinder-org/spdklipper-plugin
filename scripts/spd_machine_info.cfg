# SPD Machine Info Macros
# ========================
# Include this file in printer.cfg:
#   [include spd_machine_info.cfg]
#
# This provides persistent Machine Info display on Fluidd/Mainsail via:
#   1. DISPLAY_SPD_INFO - Shows Machine Info on Fluidd/Mainsail via M117 + RESPOND
#   2. SPD_MACHINE_INFO - Shows cached Machine Info from SAVE_VARIABLE
#   3. _SPD_UPDATE_INFO - Internal periodic updater (called by DELAYED_GCODE)
#
# How Fluidd/Mainsail displays the info:
#   - M117 message appears in Fluidd's status bar (top-right)
#   - RESPOND messages appear in Fluidd's Console tab
#   - SAVE_VARIABLE data can be read by Fluidd's custom cards
#
# Prerequisites:
#   - SPDKlipper plugin running on localhost:1122
#   - Moonraker with [http_client] configured
#   - Moonraker with [spd_status] component installed
#   - This file included in printer.cfg

[gcode_macro DISPLAY_SPD_INFO]
description: Fetch and display SPD Machine Info on Fluidd/Mainsail
gcode:
    # Fetch machine info from SPDKlipper plugin API
    RESPOND TYPE=command MSG="Fetching SPD Machine Info..."
    
    # Use Moonraker's http_client to call SPDKlipper plugin API
    # The plugin runs on localhost:1122
    {% set result = printer["gcode_macro _SPD_FETCH_INFO"].result %}
    
    # Parse the response
    {% set machine_id = result.get('machine_id', 'N/A') %}
    {% set status = result.get('status', 'unknown') %}
    {% set last_seen = result.get('last_seen', 'N/A') %}
    {% set connected = result.get('connected', false) %}
    {% set machine_name = result.get('machine_name', '') %}
    
    # Format last_seen to readable time
    {% set last_seen_short = last_seen[-8:] if last_seen|length >= 8 else last_seen %}
    
    # Display on Fluidd/Mainsail status bar via M117
    # This message persists until another M117 overwrites it
    {% if connected %}
        M117 SPD | ID:{machine_id} | CONNECTED | Last:{last_seen_short}
    {% else %}
        M117 SPD | ID:{machine_id} | DISCONNECTED | Last:{last_seen_short}
    {% endif %}
    
    # Also respond with full details (visible in Fluidd Console tab)
    RESPOND TYPE=command MSG="========================================"
    RESPOND TYPE=command MSG="  SPD Machine Info"
    RESPOND TYPE=command MSG="----------------------------------------"
    RESPOND TYPE=command MSG="  Machine ID : {machine_id}"
    {% if machine_name %}
    RESPOND TYPE=command MSG="  Name       : {machine_name}"
    {% endif %}
    {% if connected %}
    RESPOND TYPE=command MSG="  Status     : ● CONNECTED"
    {% else %}
    RESPOND TYPE=command MSG="  Status     : ○ DISCONNECTED"
    {% endif %}
    RESPOND TYPE=command MSG="  Last Seen  : {last_seen}"
    RESPOND TYPE=command MSG="========================================"
    
    # Save to persistent variables for dashboard display
    SAVE_VARIABLE VARIABLE=spd_machine_id VALUE='"{machine_id}"'
    SAVE_VARIABLE VARIABLE=spd_status VALUE='"{status}"'
    SAVE_VARIABLE VARIABLE=spd_connected VALUE='{"true" if connected else "false"}'
    SAVE_VARIABLE VARIABLE=spd_last_seen VALUE='"{last_seen}"'
    SAVE_VARIABLE VARIABLE=spd_last_updated VALUE='"{printer["system_stats"].sys_time}"'


[gcode_macro _SPD_FETCH_INFO]
description: Internal - Fetch SPD Machine Info via HTTP (do not call directly)
gcode:
    # Use Moonraker's http_client to call the SPDKlipper plugin API
    # The plugin exposes /machine/info at localhost:1122
    {action_call_remote_method(
        "http_client_request",
        method="GET",
        url="http://localhost:1122/machine/info",
        timeout=5.0
    )}


[gcode_macro SPD_MACHINE_INFO]
description: Display SPD Machine Info variables (for dashboard/console)
gcode:
    {% set mid = printer.save_variables.variables.get('spd_machine_id', 'N/A') %}
    {% set st = printer.save_variables.variables.get('spd_status', 'unknown') %}
    {% set ls = printer.save_variables.variables.get('spd_last_seen', 'N/A') %}
    {% set lu = printer.save_variables.variables.get('spd_last_updated', 'N/A') %}
    {% set cn = printer.save_variables.variables.get('spd_connected', 'false') %}
    
    {% if cn == 'true' %}
        {% set status_icon = '●' %}
        {% set status_label = 'CONNECTED' %}
    {% else %}
        {% set status_icon = '○' %}
        {% set status_label = 'DISCONNECTED' %}
    {% endif %}
    
    RESPOND TYPE=command MSG="========================================"
    RESPOND TYPE=command MSG="  SPD Machine Info (cached)"
    RESPOND TYPE=command MSG="----------------------------------------"
    RESPOND TYPE=command MSG="  Machine ID  : {mid}"
    RESPOND TYPE=command MSG="  Status      : {status_icon} {status_label}"
    RESPOND TYPE=command MSG="  Last Seen   : {ls}"
    RESPOND TYPE=command MSG="  Last Updated: {lu}"
    RESPOND TYPE=command MSG="========================================"


# ============================================================
# Auto-update via Delayed GCode (runs every 30 seconds)
# ============================================================
[delayed_gcode _SPD_AUTO_UPDATE]
initial_duration: 10
gcode:
    # Fetch and display machine info
    DISPLAY_SPD_INFO
    
    # Schedule next update in 30 seconds
    UPDATE_DELAYED_GCODE ID=_SPD_AUTO_UPDATE DURATION=30


# ============================================================
# Initialize on Klipper startup
# ============================================================
[delayed_gcode _SPD_INIT]
initial_duration: 5
gcode:
    # Initialize save_variables with defaults if not set
    {% set vars = printer.save_variables.variables %}
    {% if vars.get('spd_machine_id') is none %}
        SAVE_VARIABLE VARIABLE=spd_machine_id VALUE='""'
        SAVE_VARIABLE VARIABLE=spd_status VALUE='"unknown"'
        SAVE_VARIABLE VARIABLE=spd_connected VALUE='"false"'
        SAVE_VARIABLE VARIABLE=spd_last_seen VALUE='""'
        SAVE_VARIABLE VARIABLE=spd_last_updated VALUE='""'
    {% endif %}
    
    # Start the auto-update loop
    UPDATE_DELAYED_GCODE ID=_SPD_AUTO_UPDATE DURATION=5
